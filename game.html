<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Runner Game - Master Edition</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #0f0c29; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; touch-action: none; }
        
        /* UI レイアウト */
        #ui { position: absolute; top: 15px; left: 15px; color: #fff; text-shadow: 2px 2px 6px rgba(0,0,0,0.8); pointer-events: none; z-index: 5; }
        .stat-box { font-size: 18px; font-weight: bold; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
        .stat-box span { color: #f1c40f; }
        
        /* コンボ表示 */
        #combo-display { font-size: 24px; color: #ff9f43; font-weight: 900; opacity: 0; transition: opacity 0.2s, transform 0.1s; transform: scale(0.8); text-shadow: 0 0 10px rgba(255,159,67,0.8); }
        
        /* 200m進捗メーター */
        #progress-container { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); width: 200px; background: rgba(0,0,0,0.5); border-radius: 10px; padding: 4px; border: 1px solid rgba(255,255,255,0.2); pointer-events: none; z-index: 5; text-align: center; }
        #progress-label { color: #fff; font-size: 10px; font-weight: bold; margin-bottom: 2px; }
        #progress-bar-bg { width: 100%; height: 8px; background: rgba(255,255,255,0.2); border-radius: 4px; overflow: hidden; }
        #progress-bar-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #3498db, #9b59b6); transition: width 0.1s; }

        /* フィーバーゲージ */
        #fever-container { position: absolute; top: 48px; left: 50%; transform: translateX(-50%); width: 200px; background: rgba(0,0,0,0.5); border-radius: 10px; padding: 4px; border: 1px solid rgba(255,215,0,0.4); pointer-events: none; z-index: 5; text-align: center; }
        #fever-label { color: #f1c40f; font-size: 10px; font-weight: bold; margin-bottom: 2px; }
        #fever-bar-fill { width: 0%; height: 8px; background: linear-gradient(90deg, #f1c40f, #e67e22); border-radius: 4px; transition: width 0.2s; }

        /* ミッションバッジ */
        #mission-box { position: absolute; top: 80px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.6); color: #2ecc71; font-size: 12px; font-weight: bold; padding: 4px 12px; border-radius: 12px; border: 1px solid #2ecc71; pointer-events: none; z-index: 5; }

        /* 右上操作ボタン */
        #top-controls { position: absolute; top: 15px; right: 15px; display: flex; gap: 8px; z-index: 10; }
        .icon-btn { background: rgba(255,255,255,0.2); color: white; border: none; padding: 10px; border-radius: 50%; width: 44px; height: 44px; font-size: 20px; cursor: pointer; backdrop-filter: blur(5px); transition: 0.2s; }
        .icon-btn:hover { background: rgba(255,255,255,0.4); transform: scale(1.05); }

        /* パワーアップステータス表示 */
        #powerup-status { position: absolute; top: 70px; right: 15px; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; pointer-events: none; z-index: 5; }
        .badge { padding: 6px 12px; border-radius: 20px; color: #fff; font-weight: bold; font-size: 13px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); display: flex; align-items: center; gap: 6px; }
        .badge-shield { background: linear-gradient(45deg, #2ecc71, #27ae60); }
        .badge-magnet { background: linear-gradient(45deg, #3498db, #2980b9); }
        .badge-multiplier { background: linear-gradient(45deg, #e67e22, #d35400); }
        .badge-fever { background: linear-gradient(45deg, #f1c40f, #e74c3c); animation: pulse 0.5s infinite alternate; }

        @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.08); } }

        /* オーバーレイ (ポーズ & ゲームオーバー & ショップ) */
        .modal { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 12, 41, 0.9); display: none; flex-direction: column; justify-content: center; align-items: center; color: #fff; backdrop-filter: blur(8px); z-index: 20; }
        .modal h1 { font-size: 48px; margin: 0 0 10px 0; text-shadow: 0 0 20px rgba(255,255,255,0.3); }
        .score-board { background: rgba(255,255,255,0.1); padding: 20px 40px; border-radius: 12px; text-align: center; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.2); }
        .score-board p { font-size: 18px; margin: 8px 0; }
        
        button { padding: 12px 30px; font-size: 20px; background: linear-gradient(45deg, #ff4757, #ff6b81); color: #fff; border: none; border-radius: 30px; cursor: pointer; font-weight: bold; box-shadow: 0 6px 20px rgba(255,71,87,0.4); transition: 0.2s; margin: 5px; }
        button:hover { transform: scale(1.08); box-shadow: 0 8px 25px rgba(255,71,87,0.6); }

        /* ショップアイテム一覧 */
        .shop-items { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; }
        .shop-card { background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.2); border-radius: 12px; padding: 15px; text-align: center; width: 100px; }
        .shop-card.selected { border-color: #f1c40f; background: rgba(241, 196, 15, 0.2); }
        .color-preview { width: 40px; height: 40px; border-radius: 50%; margin: 0 auto 10px; border: 2px solid #fff; }
    </style>
</head>
<body>
    <div id="ui">
        <div class="stat-box">SCORE: <span id="score">0</span>m</div>
        <div class="stat-box">HIGH: <span id="high-score">0</span>m</div>
        <div class="stat-box">COINS: <span id="coins">0</span> 🪙</div>
        <div id="combo-display">1x COMBO!</div>
    </div>

    <div id="progress-container">
        <div id="progress-label">NEXT CITY: <span id="dist-text">200</span>m</div>
        <div id="progress-bar-bg"><div id="progress-bar-fill"></div></div>
    </div>

    <div id="fever-container">
        <div id="fever-label">FEVER GAUGE</div>
        <div id="fever-bar-fill"></div>
    </div>

    <div id="mission-box">🎯 TARGET: <span id="mission-desc">Loading...</span></div>

    <div id="top-controls">
        <button class="icon-btn" onclick="togglePause()">⏸️</button>
        <button class="icon-btn" id="audio-btn" onclick="toggleAudio()">🔊</button>
    </div>

    <div id="powerup-status"></div>

    <div id="pause-modal" class="modal">
        <h1>PAUSED</h1>
        <button onclick="togglePause()">RESUME</button>
    </div>

    <div id="game-over" class="modal">
        <h1 style="color: #ff4757;">GAME OVER</h1>
        <div class="score-board">
            <p>DISTANCE: <span id="final-score">0</span>m</p>
            <p>COINS: <span id="final-coins">0</span> 🪙</p>
            <p style="color: #f1c40f; font-weight: bold; display: none;" id="new-record-msg">🎉 NEW HIGH SCORE! 🎉</p>
        </div>
        <div>
            <button onclick="resetGame()">RETRY</button>
            <button onclick="openShop()" style="background: linear-gradient(45deg, #3498db, #2980b9);">🛒 SHOP</button>
        </div>
    </div>

    <div id="shop-modal" class="modal">
        <h1 style="color: #3498db;">SKIN SHOP</h1>
        <p>Total Coins: <span id="shop-coins-display" style="color: #f1c40f; font-weight: bold;">0</span> 🪙</p>
        <div class="shop-items" id="shop-items-list"></div>
        <button onclick="closeShop()">BACK</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- サウンドシステム (Web Audio API) ---
        class SoundSystem {
            constructor() { this.ctx = null; this.muted = false; }
            init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
            playTone(freq, type, duration, startVol = 0.1, endVol = 0.01) {
                if (this.muted || !this.ctx) return;
                const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
                osc.type = type; osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                gain.gain.setValueAtTime(startVol, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(endVol, this.ctx.currentTime + duration);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + duration);
            }
            playSweep(startFreq, endFreq, type, duration) {
                if (this.muted || !this.ctx) return;
                const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
                osc.type = type; osc.frequency.setValueAtTime(startFreq, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(endFreq, this.ctx.currentTime + duration);
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + duration);
            }
            jump() { this.playSweep(180, 500, 'sine', 0.18); }
            slide() { this.playSweep(300, 100, 'triangle', 0.2); }
            coin() { this.playTone(987, 'sine', 0.08, 0.2); setTimeout(() => this.playTone(1318, 'sine', 0.12, 0.2), 60); }
            fever() { this.playSweep(300, 1200, 'sawtooth', 0.6); }
            powerup() { [523, 659, 783, 1046].forEach((f, i) => setTimeout(() => this.playTone(f, 'sine', 0.15, 0.15), i * 50)); }
            shieldBreak() { this.playSweep(800, 150, 'sawtooth', 0.3); }
            hit() {
                if (this.muted || !this.ctx) return;
                const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(120, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.4);
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.4);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.4);
            }
        }
        const audio = new SoundSystem();
        function toggleAudio() {
            audio.init(); audio.muted = !audio.muted;
            document.getElementById('audio-btn').textContent = audio.muted ? '🔇' : '🔊';
        }

        // --- ゲーム状態 ---
        const LANES = [-2.5, 0, 2.5];
        let currentLane = 1;
        let isGameOver = false, isPaused = false;
        let score = 0, coinsCollected = 0, totalBankedCoins = parseInt(localStorage.getItem('runner_total_coins') || '0');
        let highScore = parseInt(localStorage.getItem('runner_high_score') || '0');
        document.getElementById('high-score').textContent = highScore;
        document.getElementById('coins').textContent = totalBankedCoins;

        const INITIAL_SPEED = 0.45;
        const OBSTACLE_INTERVAL = 14;
        let speed = INITIAL_SPEED;

        // パワーアップ・コンボ・フィーバー
        let hasShield = false, magnetTimer = 0, multiplierTimer = 0;
        let feverGauge = 0, feverTimer = 0;
        let comboCount = 0, comboTimer = 0;

        // 画面シェイク
        let shakeIntensity = 0;

        // ショップ＆スキン
        const SKINS = [
            { id: 'blue', name: 'Blue', color: 0x1e90ff, price: 0 },
            { id: 'red', name: 'Red', color: 0xff4757, price: 30 },
            { id: 'green', name: 'Green', color: 0x2ecc71, price: 60 },
            { id: 'gold', name: 'Gold', color: 0xf1c40f, price: 120 }
        ];
        let unlockedSkins = JSON.parse(localStorage.getItem('runner_unlocked_skins') || '["blue"]');
        let currentSkinId = localStorage.getItem('runner_current_skin') || 'blue';

        // ミッション
        const MISSIONS = [
            { id: 'coins', desc: 'Collect 15 Coins in 1 run', goal: 15, progress: 0 },
            { id: 'jumps', desc: 'Jump 8 times', goal: 8, progress: 0 },
            { id: 'distance', desc: 'Reach 300m', goal: 300, progress: 0 }
        ];
        let currentMissionIdx = Math.floor(Math.random() * MISSIONS.length);

        function updateMissionUI() {
            const m = MISSIONS[currentMissionIdx];
            document.getElementById('mission-desc').textContent = `${m.desc} (${m.progress}/${m.goal})`;
        }
        updateMissionUI();

        // --- シーン・カメラ・レンダラー ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x70a1ff);
        scene.fog = new THREE.Fog(0x70a1ff, 70, 220);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6); scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 10); dirLight.castShadow = true; scene.add(dirLight);

        // テクスチャ
        const textureLoader = new THREE.TextureLoader();
        const asphaltTex = textureLoader.load('https://cdn.pixabay.com/photo/2017/08/13/11/48/asphalt-2636906_960_720.jpg');
        const curbTex = textureLoader.load('https://cdn.pixabay.com/photo/2016/10/01/16/36/concrete-1708269_960_720.jpg');
        const grassTex = textureLoader.load('https://cdn.pixabay.com/photo/2016/11/18/14/05/grass-1836691_960_720.jpg');

        asphaltTex.wrapS = asphaltTex.wrapT = THREE.RepeatWrapping; asphaltTex.repeat.set(1, 10);
        curbTex.wrapS = curbTex.wrapT = THREE.RepeatWrapping; curbTex.repeat.set(1, 20);
        grassTex.wrapS = grassTex.wrapT = THREE.RepeatWrapping; grassTex.repeat.set(1, 20);

        // --- プレイヤー生成 ---
        const playerGroup = new THREE.Group();
        const skinMat = new THREE.MeshPhongMaterial({ color: 0xffdbac });
        const shirtMat = new THREE.MeshPhongMaterial({ color: SKINS.find(s=>s.id===currentSkinId).color });
        const pantsMat = new THREE.MeshPhongMaterial({ color: 0x333333 });

        const head = new THREE.Mesh(new THREE.SphereGeometry(0.35, 16, 16), skinMat);
        head.position.y = 1.75; head.castShadow = true; playerGroup.add(head);

        const torso = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.8, 0.4), shirtMat);
        torso.position.y = 1.1; torso.castShadow = true; playerGroup.add(torso);

        const armGeo = new THREE.BoxGeometry(0.2, 0.7, 0.2); armGeo.translate(0, -0.3, 0);
        const leftArm = new THREE.Mesh(armGeo, skinMat); leftArm.position.set(-0.48, 1.4, 0); leftArm.castShadow = true; playerGroup.add(leftArm);
        const rightArm = new THREE.Mesh(armGeo, skinMat); rightArm.position.set(0.48, 1.4, 0); rightArm.castShadow = true; playerGroup.add(rightArm);

        const legGeo = new THREE.BoxGeometry(0.25, 0.7, 0.25); legGeo.translate(0, -0.3, 0);
        const leftLeg = new THREE.Mesh(legGeo, pantsMat); leftLeg.position.set(-0.2, 0.7, 0); leftLeg.castShadow = true; playerGroup.add(leftLeg);
        const rightLeg = new THREE.Mesh(legGeo, pantsMat); rightLeg.position.set(0.2, 0.7, 0); rightLeg.castShadow = true; playerGroup.add(rightLeg);

        // シールドオーラ
        const shieldGeo = new THREE.SphereGeometry(1.2, 16, 16);
        const shieldMat = new THREE.MeshBasicMaterial({ color: 0x2ecc71, transparent: true, opacity: 0.35, wireframe: true });
        const shieldMesh = new THREE.Mesh(shieldGeo, shieldMat);
        shieldMesh.position.y = 1.0; shieldMesh.visible = false; playerGroup.add(shieldMesh);

        // フィーバーオーラ
        const feverAuraGeo = new THREE.SphereGeometry(1.4, 16, 16);
        const feverAuraMat = new THREE.MeshBasicMaterial({ color: 0xf1c40f, transparent: true, opacity: 0.4, wireframe: true });
        const feverAuraMesh = new THREE.Mesh(feverAuraGeo, feverAuraMat);
        feverAuraMesh.position.y = 1.0; feverAuraMesh.visible = false; playerGroup.add(feverAuraMesh);

        const playerBody = new THREE.Mesh(new THREE.BoxGeometry(0.6, 1.7, 0.4), new THREE.MeshBasicMaterial({ visible: false }));
        playerBody.position.y = 0.85; playerGroup.add(playerBody);

        scene.add(playerGroup);

        let playerY = 0, velocityY = 0, gravity = -0.016, isJumping = false;
        let isCrouching = false, crouchTimer = 0;

        // パーティクル
        let particles = [];
        function createParticles(pos, colorHex, count = 12, speedScale = 1.0) {
            for (let i = 0; i < count; i++) {
                const p = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.15, 0.15), new THREE.MeshBasicMaterial({ color: colorHex }));
                p.position.copy(pos);
                p.velocity = new THREE.Vector3(
                    (Math.random() - 0.5) * 0.3 * speedScale,
                    (Math.random() * 0.3 + 0.1) * speedScale,
                    (Math.random() - 0.5) * 0.3 * speedScale
                );
                p.life = 1.0; scene.add(p); particles.push(p);
            }
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.position.add(p.velocity); p.scale.multiplyScalar(0.92); p.life -= 0.04;
                if (p.life <= 0) { scene.remove(p); particles.splice(i, 1); }
            }
        }

        // トラック & 建物
        const roadTileGroup = new THREE.Group(); scene.add(roadTileGroup);
        let roadTiles = [], nextRoadZ = 0, cityBuildings = [], lastCityZ = 0;

        function createRoadTile(zPos) {
            const tile = new THREE.Group();
            const asphalt = new THREE.Mesh(new THREE.PlaneGeometry(9, 100), new THREE.MeshPhongMaterial({ map: asphaltTex }));
            asphalt.rotation.x = -Math.PI / 2; asphalt.receiveShadow = true; tile.add(asphalt);

            const curbMat = new THREE.MeshPhongMaterial({ map: curbTex });
            const leftCurb = new THREE.Mesh(new THREE.PlaneGeometry(1, 100), curbMat);
            leftCurb.rotation.x = -Math.PI / 2; leftCurb.position.set(-5, 0.1, 0); tile.add(leftCurb);
            const rightCurb = new THREE.Mesh(new THREE.PlaneGeometry(1, 100), curbMat);
            rightCurb.rotation.x = -Math.PI / 2; rightCurb.position.set(5, 0.1, 0); tile.add(rightCurb);

            const grassMat = new THREE.MeshPhongMaterial({ map: grassTex });
            const leftGrass = new THREE.Mesh(new THREE.PlaneGeometry(20, 100), grassMat);
            leftGrass.rotation.x = -Math.PI / 2; leftGrass.position.set(-16, 0.05, 0); tile.add(leftGrass);
            const rightGrass = new THREE.Mesh(new THREE.PlaneGeometry(20, 100), grassMat);
            rightGrass.rotation.x = -Math.PI / 2; rightGrass.position.set(16, 0.05, 0); tile.add(rightGrass);

            tile.position.z = zPos; roadTileGroup.add(tile); roadTiles.push(tile);
        }

        function spawnCityBlock(zPos) {
            for (let i = 0; i < 20; i++) {
                const height = 15 + Math.random() * 35;
                const b = new THREE.Mesh(
                    new THREE.BoxGeometry(4 + Math.random() * 6, height, 4 + Math.random() * 6),
                    new THREE.MeshPhongMaterial({ color: 0x1a1a2e })
                );
                const side = (Math.random() < 0.5 ? 1 : -1);
                b.position.set(side * (20 + Math.random() * 40), height / 2, zPos - (Math.random() * 180));
                scene.add(b); cityBuildings.push(b);
            }
        }

        // 障害物 & アイテム
        let obstacles = [], coins = [], powerups = [], movingObstacles = [];
        let lastObstacleZ = -30;

        const obsTypes = [
            { geo: new THREE.BoxGeometry(2.0, 0.4, 0.3), mat: new THREE.MeshPhongMaterial({ color: 0x00cec9 }), yPos: 0.2 },
            { geo: new THREE.ConeGeometry(0.45, 1.0, 16), mat: new THREE.MeshPhongMaterial({ color: 0xff7675 }), yPos: 0.5 },
            { geo: new THREE.BoxGeometry(1.0, 0.9, 1.0), mat: new THREE.MeshPhongMaterial({ color: 0xe17055 }), yPos: 0.45 },
            { geo: new THREE.BoxGeometry(1.9, 3.5, 0.8), mat: new THREE.MeshPhongMaterial({ color: 0xd63031 }), yPos: 1.75 }
        ];

        function spawnWorldItems(zPos) {
            const emptyLane = Math.floor(Math.random() * 3);

            if (Math.random() < 0.2) {
                const truck = new THREE.Mesh(new THREE.BoxGeometry(1.8, 1.2, 3.0), new THREE.MeshPhongMaterial({ color: 0x9b59b6 }));
                truck.position.set(0, 0.6, zPos);
                truck.castShadow = true;
                truck.movingDir = 1;
                truck.baseZ = zPos;
                scene.add(truck);
                movingObstacles.push(truck);
                return;
            }

            for (let i = 0; i < 3; i++) {
                if (i === emptyLane) {
                    if (Math.random() < 0.8 || feverTimer > 0) {
                        const coinGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.08, 16);
                        const coinMat = new THREE.MeshStandardMaterial({ color: 0xf1c40f, metalness: 0.8, roughness: 0.2 });
                        for (let c = 0; c < 3; c++) {
                            const coin = new THREE.Mesh(coinGeo, coinMat);
                            coin.rotation.x = Math.PI / 2;
                            coin.position.set(LANES[i], 0.6, zPos - c * 2.2);
                            scene.add(coin); coins.push(coin);
                        }
                    } else if (Math.random() < 0.25) {
                        const types = ['shield', 'magnet', 'multiplier'];
                        const pType = types[Math.floor(Math.random() * types.length)];
                        let color = (pType==='shield'?0x2ecc71:(pType==='magnet'?0x3498db:0xe67e22));
                        const pMesh = new THREE.Mesh(new THREE.OctahedronGeometry(0.4), new THREE.MeshPhongMaterial({ color, emissive: color, emissiveIntensity: 0.5 }));
                        pMesh.position.set(LANES[i], 0.8, zPos);
                        pMesh.pType = pType;
                        scene.add(pMesh); powerups.push(pMesh);
                    }
                    continue;
                }

                if (Math.random() < 0.75 && feverTimer === 0) {
                    const obsType = obsTypes[Math.floor(Math.random() * obsTypes.length)];
                    const obs = new THREE.Mesh(obsType.geo, obsType.mat);
                    obs.position.set(LANES[i], obsType.yPos, zPos);
                    obs.castShadow = true; scene.add(obs); obstacles.push(obs);
                }
            }
        }

        function ensureWorldGenerated() {
            while (nextRoadZ > playerGroup.position.z - 300) { createRoadTile(nextRoadZ); nextRoadZ -= 100; }
            while (lastObstacleZ > playerGroup.position.z - 250) { lastObstacleZ -= OBSTACLE_INTERVAL; spawnWorldItems(lastObstacleZ); }
            while (lastCityZ > playerGroup.position.z - 350) { spawnCityBlock(lastCityZ); lastCityZ -= 200; }
        }

        let touchStartX = 0, touchStartY = 0;
        window.addEventListener('keydown', (e) => {
            audio.init();
            if (e.key === 'p' || e.key === 'P') togglePause();
            if (isGameOver || isPaused) return;

            if ((e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') && currentLane > 0) currentLane--;
            if ((e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') && currentLane < 2) currentLane++;
            if ((e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W' || e.key === ' ') && !isJumping) {
                velocityY = 0.33; isJumping = true; audio.jump();
                checkMissionProgress('jumps', 1);
            }
            if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') {
                if (isJumping) velocityY = -0.45;
                isCrouching = true; crouchTimer = 32; audio.slide();
            }
        });

        window.addEventListener('touchstart', (e) => { audio.init(); touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY; }, { passive: true });
        window.addEventListener('touchend', (e) => {
            if (isGameOver || isPaused) return;
            const dx = e.changedTouches[0].clientX - touchStartX, dy = e.changedTouches[0].clientY - touchStartY;
            if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 30) {
                if (dx > 0 && currentLane < 2) currentLane++;
                else if (dx < 0 && currentLane > 0) currentLane--;
            } else if (Math.abs(dy) > 30) {
                if (dy < 0 && !isJumping) { velocityY = 0.33; isJumping = true; audio.jump(); checkMissionProgress('jumps', 1); }
                else if (dy > 0) { if (isJumping) velocityY = -0.45; isCrouching = true; crouchTimer = 32; audio.slide(); }
            }
        }, { passive: true });

        function togglePause() {
            if (isGameOver) return;
            isPaused = !isPaused;
            document.getElementById('pause-modal').style.display = isPaused ? 'flex' : 'none';
            if (!isPaused) animate();
        }

        function checkMissionProgress(type, amount) {
            const m = MISSIONS[currentMissionIdx];
            if (m.id === type) {
                m.progress += amount;
                if (m.progress >= m.goal) {
                    totalBankedCoins += 30;
                    localStorage.setItem('runner_total_coins', totalBankedCoins);
                    document.getElementById('coins').textContent = totalBankedCoins;
                    m.progress = m.goal;
                    document.getElementById('mission-box').innerHTML = `🎉 MISSION COMPLETE! (+30🪙)`;
                    setTimeout(() => {
                        currentMissionIdx = (currentMissionIdx + 1) % MISSIONS.length;
                        MISSIONS[currentMissionIdx].progress = 0;
                        updateMissionUI();
                    }, 2500);
                } else {
                    updateMissionUI();
                }
            }
        }

        function openShop() {
            document.getElementById('shop-coins-display').textContent = totalBankedCoins;
            const container = document.getElementById('shop-items-list');
            container.innerHTML = '';
            SKINS.forEach(s => {
                const isUnlocked = unlockedSkins.includes(s.id);
                const isSelected = currentSkinId === s.id;
                const card = document.createElement('div');
                card.className = `shop-card ${isSelected ? 'selected' : ''}`;
                card.innerHTML = `
                    <div class="color-preview" style="background-color: #${s.color.toString(16)}"></div>
                    <div style="font-weight:bold; font-size:14px">${s.name}</div>
                    <div style="font-size:12px; margin-top:5px; color:#f1c40f">${isUnlocked ? (isSelected ? 'EQUIPPED' : 'OWNED') : s.price + ' 🪙'}</div>
                `;
                card.onclick = () => selectOrBuySkin(s);
                container.appendChild(card);
            });
            document.getElementById('shop-modal').style.display = 'flex';
        }

        function selectOrBuySkin(skin) {
            if (unlockedSkins.includes(skin.id)) {
                currentSkinId = skin.id;
                shirtMat.color.setHex(skin.color);
                localStorage.setItem('runner_current_skin', currentSkinId);
                openShop();
            } else if (totalBankedCoins >= skin.price) {
                totalBankedCoins -= skin.price;
                unlockedSkins.push(skin.id);
                currentSkinId = skin.id;
                shirtMat.color.setHex(skin.color);
                localStorage.setItem('runner_total_coins', totalBankedCoins);
                localStorage.setItem('runner_unlocked_skins', JSON.stringify(unlockedSkins));
                localStorage.setItem('runner_current_skin', currentSkinId);
                document.getElementById('coins').textContent = totalBankedCoins;
                openShop();
            }
        }

        function closeShop() { document.getElementById('shop-modal').style.display = 'none'; }

        function resetGame() {
            currentLane = 1; playerGroup.position.set(0, 0, 0);
            playerY = 0; velocityY = 0; isJumping = false; isCrouching = false;
            hasShield = false; magnetTimer = 0; multiplierTimer = 0; feverGauge = 0; feverTimer = 0;
            comboCount = 0; comboTimer = 0; shakeIntensity = 0;
            shieldMesh.visible = false; feverAuraMesh.visible = false;

            obstacles.forEach(o => scene.remove(o)); obstacles = [];
            coins.forEach(c => scene.remove(c)); coins = [];
            powerups.forEach(p => scene.remove(p)); powerups = [];
            particles.forEach(p => scene.remove(p)); particles = [];
            cityBuildings.forEach(b => scene.remove(b)); cityBuildings = [];
            movingObstacles.forEach(m => scene.remove(m)); movingObstacles = [];

            lastObstacleZ = -30; lastCityZ = 0; roadTiles.forEach(t => roadTileGroup.remove(t)); roadTiles = []; nextRoadZ = 0;
            score = 0; coinsCollected = 0; speed = INITIAL_SPEED; isGameOver = false; isPaused = false;

            document.getElementById('game-over').style.display = 'none';
            document.getElementById('new-record-msg').style.display = 'none';
            document.getElementById('score').textContent = '0';
            document.getElementById('fever-bar-fill').style.width = '0%';

            updatePowerupUI();
            ensureWorldGenerated();
            animate();
        }

        function updatePowerupUI() {
            const container = document.getElementById('powerup-status');
            container.innerHTML = '';
            if (feverTimer > 0) container.innerHTML += `<div class="badge badge-fever">🔥 FEVER MODE (${Math.ceil(feverTimer/60)}s)</div>`;
            if (hasShield) container.innerHTML += `<div class="badge badge-shield">🛡️ SHIELD</div>`;
            if (magnetTimer > 0) container.innerHTML += `<div class="badge badge-magnet">🧲 MAGNET (${Math.ceil(magnetTimer/60)}s)</div>`;
            if (multiplierTimer > 0) container.innerHTML += `<div class="badge badge-multiplier">2️⃣ 2X SCORE (${Math.ceil(multiplierTimer/60)}s)</div>`;
        }

        function update() {
            if (isGameOver || isPaused) return;

            const pointsGain = (multiplierTimer > 0 ? 2 : 1) * (feverTimer > 0 ? 3 : 1);
            playerGroup.position.z -= speed * (feverTimer > 0 ? 1.5 : 1.0);
            score = Math.floor(-playerGroup.position.z);
            document.getElementById('score').textContent = score;

            checkMissionProgress('distance', score);
            speed += 0.00003;

            const distToNextCity = 200 - (score % 200);
            document.getElementById('dist-text').textContent = Math.ceil(distToNextCity);
            document.getElementById('progress-bar-fill').style.width = `${((200 - distToNextCity) / 200) * 100}%`;

            const dayCycle = (score % 1200) / 1200;
            let skyColor = new THREE.Color(0x70a1ff);
            if (dayCycle > 0.4 && dayCycle <= 0.7) skyColor.lerp(new THREE.Color(0xe66767), (dayCycle - 0.4) * 3.3);
            else if (dayCycle > 0.7) skyColor.lerp(new THREE.Color(0x0f0c29), (dayCycle - 0.7) * 3.3);
            scene.background = skyColor; scene.fog.color = skyColor;

            camera.fov = 60 + (speed - INITIAL_SPEED) * 20 + (feverTimer > 0 ? 10 : 0);
            camera.updateProjectionMatrix();

            if (magnetTimer > 0) magnetTimer--;
            if (multiplierTimer > 0) multiplierTimer--;
            if (feverTimer > 0) {
                feverTimer--;
                if (feverTimer === 0) feverAuraMesh.visible = false;
            }

            if (comboTimer > 0) {
                comboTimer--;
                if (comboTimer === 0) {
                    comboCount = 0;
                    document.getElementById('combo-display').style.opacity = '0';
                }
            }

            updatePowerupUI();

            playerGroup.position.x += (LANES[currentLane] - playerGroup.position.x) * 0.22;

            if (isJumping) {
                playerY += velocityY; velocityY += gravity;
                if (playerY <= 0) { playerY = 0; isJumping = false; }
            }
            playerGroup.position.y = playerY;

            if (crouchTimer > 0) { crouchTimer--; if (crouchTimer <= 0) isCrouching = false; }
            playerGroup.scale.y += ((isCrouching ? 0.45 : 1.0) - playerGroup.scale.y) * 0.3;

            if (!isJumping && Math.random() < 0.4) {
                createParticles(new THREE.Vector3(playerGroup.position.x, 0.1, playerGroup.position.z), 0xcccccc, 1, 0.3);
            }

            if (!isJumping) {
                const runTime = Date.now() * 0.013 * (speed / INITIAL_SPEED);
                leftArm.rotation.x = Math.sin(runTime) * 0.7; rightArm.rotation.x = -Math.sin(runTime) * 0.7;
                leftLeg.rotation.x = -Math.sin(runTime) * 0.7; rightLeg.rotation.x = Math.sin(runTime) * 0.7;
            }

            if (hasShield) shieldMesh.rotation.y += 0.05;
            if (feverTimer > 0) feverAuraMesh.rotation.y += 0.1;

            let shakeX = (Math.random() - 0.5) * shakeIntensity;
            let shakeY = (Math.random() - 0.5) * shakeIntensity;
            if (shakeIntensity > 0) shakeIntensity *= 0.88;

            camera.position.x = playerGroup.position.x * 0.3 + shakeX;
            camera.position.y = playerGroup.position.y + 4 + shakeY;
            camera.position.z = playerGroup.position.z + 8;
            camera.lookAt(playerGroup.position.x * 0.2, playerGroup.position.y + 1, playerGroup.position.z - 8);

            ensureWorldGenerated();
            updateParticles();

            for (let i = cityBuildings.length - 1; i >= 0; i--) {
                if (cityBuildings[i].position.z > playerGroup.position.z + 50) {
                    scene.remove(cityBuildings[i]); cityBuildings.splice(i, 1);
                }
            }

            movingObstacles.forEach(m => {
                m.position.x = Math.sin(Date.now() * 0.003 + m.baseZ) * 2.5;
            });

            const playerBox = new THREE.Box3().setFromObject(playerBody);

            for (let i = coins.length - 1; i >= 0; i--) {
                const c = coins[i];
                c.rotation.z += 0.05;

                if ((magnetTimer > 0 || feverTimer > 0) && c.position.distanceTo(playerGroup.position) < 14) {
                    c.position.lerp(playerGroup.position, 0.2);
                }

                if (playerBox.intersectsBox(new THREE.Box3().setFromObject(c))) {
                    coinsCollected++;
                    totalBankedCoins++;
                    localStorage.setItem('runner_total_coins', totalBankedCoins);
                    document.getElementById('coins').textContent = totalBankedCoins;
                    audio.coin();
                    checkMissionProgress('coins', 1);

                    comboCount++;
                    comboTimer = 100;
                    const comboUI = document.getElementById('combo-display');
                    comboUI.textContent = `${comboCount}x COMBO!`;
                    comboUI.style.opacity = '1';
                    comboUI.style.transform = 'scale(1.2)';
                    setTimeout(() => comboUI.style.transform = 'scale(1.0)', 100);

                    // --- フィーバーゲージ蓄積（増加量を 8 -> 3 に変更して遅く調整）---
                    if (feverTimer === 0) {
                        feverGauge = Math.min(100, feverGauge + 3);
                        document.getElementById('fever-bar-fill').style.width = `${feverGauge}%`;
                        if (feverGauge >= 100) {
                            feverTimer = 400;
                            feverGauge = 0;
                            feverAuraMesh.visible = true;
                            audio.fever();
                            document.getElementById('fever-bar-fill').style.width = '0%';
                        }
                    }

                    createParticles(c.position, 0xf1c40f, 10);
                    scene.remove(c); coins.splice(i, 1);
                } else if (c.position.z > playerGroup.position.z + 10) {
                    scene.remove(c); coins.splice(i, 1);
                }
            }

            for (let i = powerups.length - 1; i >= 0; i--) {
                const p = powerups[i];
                p.rotation.y += 0.04;
                if (playerBox.intersectsBox(new THREE.Box3().setFromObject(p))) {
                    audio.powerup();
                    createParticles(p.position, p.material.color.getHex(), 15);
                    if (p.pType === 'shield') { hasShield = true; shieldMesh.visible = true; }
                    if (p.pType === 'magnet') magnetTimer = 500;
                    if (p.pType === 'multiplier') multiplierTimer = 500;
                    scene.remove(p); powerups.splice(i, 1);
                }
            }

            const allObstacles = [...obstacles, ...movingObstacles];
            for (let i = allObstacles.length - 1; i >= 0; i--) {
                const obs = allObstacles[i];

                // 画面の外へ出た障害物は、シーンだけでなく配列からも削除する
                if (obs.position.z > playerGroup.position.z + 10) {
                    scene.remove(obs);
                    const oi = obstacles.indexOf(obs);
                    if (oi !== -1) obstacles.splice(oi, 1);
                    const mi = movingObstacles.indexOf(obs);
                    if (mi !== -1) movingObstacles.splice(mi, 1);
                    continue;
                }

                if (playerBox.intersectsBox(new THREE.Box3().setFromObject(obs))) {
                    if (feverTimer > 0) {
                        shakeIntensity = 0.4;
                        createParticles(obs.position, 0xf1c40f, 15, 2.0);
                        scene.remove(obs);

                        const oi = obstacles.indexOf(obs);
                        if (oi !== -1) obstacles.splice(oi, 1);
                        const mi = movingObstacles.indexOf(obs);
                        if (mi !== -1) movingObstacles.splice(mi, 1);

                    } else if (hasShield) {
                        // シールドで障害物を1個防ぐ
                        hasShield = false;
                        shieldMesh.visible = false;
                        shakeIntensity = 0.5;
                        audio.shieldBreak();
                        createParticles(obs.position, 0x2ecc71, 20, 2.0);
                        scene.remove(obs);

                        // 防いだ障害物を配列からも消す。
                        // これをしないと次のフレームで同じ障害物に再衝突して
                        // シールドが無い状態になり、ゲームオーバーになっていた。
                        const oi = obstacles.indexOf(obs);
                        if (oi !== -1) obstacles.splice(oi, 1);
                        const mi = movingObstacles.indexOf(obs);
                        if (mi !== -1) movingObstacles.splice(mi, 1);

                    } else {
                        isGameOver = true;
                        shakeIntensity = 1.2;
                        audio.hit();
                        createParticles(playerGroup.position, 0xff4757, 30, 2.5);

                        if (score > highScore) {
                            highScore = score;
                            localStorage.setItem('runner_high_score', highScore);
                            document.getElementById('high-score').textContent = highScore;
                            document.getElementById('new-record-msg').style.display = 'block';
                        }

                        document.getElementById('final-score').textContent = score;
                        document.getElementById('final-coins').textContent = coinsCollected;
                        document.getElementById('game-over').style.display = 'flex';

                        // ゲームオーバーになったら、このフレームの残りの障害物判定を止める
                        break;
                    }
                }
            }
        }

        function animate() {
            if (!isGameOver && !isPaused) {
                requestAnimationFrame(animate);
                update();
                renderer.render(scene, camera);
            }
        }

        ensureWorldGenerated();
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
